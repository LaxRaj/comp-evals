[project]
name = "comp-evals"
version = "0.1.0"
description = "Open-source eval harness scoring frontier models on synthetic compensation-reasoning scenarios."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116.0",
    "google-genai>=2.10.0",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.scripts]
comp-evals = "comp_evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comp_evals"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
